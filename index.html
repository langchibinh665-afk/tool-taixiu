<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Tool Tài Xỉu - BÌNH</title>
<title>cờ bạc không giúp ta đổi đời,nó chỉ giúp đổi số dư tk</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  body{background:#0d011a;color:#e5e1ea;font-family:Arial,sans-serif;padding:18px;text-align:center;}
  h1{color:#e6dfed;text-shadow:0 0 12px #080110;margin-bottom:6px;}
  .box{background:#150022;border:2px solid #080113;padding:18px;border-radius:12px;max-width:520px;margin:12px auto;box-shadow:0 0 25px #060011;}
  input{width:86%;padding:10px;border-radius:8px;border:2px solid #b5abc2;background:#1b0030;color:#eae8ee;margin:8px 0;display:block;margin-left:auto;margin-right:auto;}
  .btns{display:flex;justify-content:center;gap:14px;margin-top:12px;}
  button{padding:10px 16px;border-radius:8px;border:0;background:#040009;color:#fff;cursor:pointer;box-shadow:0 0 12px #fffeff;flex:1;max-width:160px;}
  button:hover{background:#b17dff;}
  #result{margin-top:18px;font-size:34px;font-weight:700;text-shadow:0 0 8px #bca0bc;min-height:56px;display:flex;align-items:center;justify-content:center;}
  #result.tai{ color:#e3ebeb; text-shadow:0 0 8px #b2e4e0,0 0 20px #a6d3cf; }
  #result.xiu{ color:#190219; text-shadow:0 0 8px #fdffffff,0 0 20px #f5f0f5ff; }
  #keyTimer{margin-top:8px;color:#dcd0ff;font-size:14px;}
  .small{font-size:13px;color:#e8d8ff;margin-top:6px;}
</style>
</head>

<body>

<audio id="bgMusic" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<h1>Tool Tài Xỉu - BÌNH</h1>
<h1>cờ bạc không giúp ta đổi đời,nó chỉ giúp đổi số dư tk</h1>

<div id="keyBox" class="box">
  <h3>Nhập key</h3>
  <input id="keyInput" placeholder="Nhập key..." autocomplete="off" />
  <div class="btns">
    <button onclick="checkKey()">Xác thực</button>
  </div>
  <p id="keyMsg" class="small"></p>
</div>

<div id="mainTool" class="box" style="display:none;">
  <h3>Phân tích từ MD5 / SHA-256</h3>
  <input id="md5Input" placeholder="Dán chuỗi MD5 (32) hoặc SHA-256 (64)" autocomplete="off"/>
  <div class="btns">
    <button onclick="runAnalyze()">Phân Tích</button>
  </div>
  <div id="keyTimer" aria-live="polite"></div>
  <div id="result" aria-live="polite"></div>
  <p class="small">Chú ý: tool chỉ là công cụ tham khảo .</p>
</div>

<script>
const KEY_LIST = {
  "BINHVIPPRO": 10000000000,
  "bumanh":1000,
};

const LS_ACCESS = 'tool_access_multi_v2';
const LS_USED = 'tool_used_keys_v2';

function getUsedKeys(){
  try { return JSON.parse(localStorage.getItem(LS_USED) || '[]'); } catch(e){ return []; }
}
function markKeyUsed(key){
  const arr = getUsedKeys();
  if(!arr.includes(key)) arr.push(key);
  localStorage.setItem(LS_USED, JSON.stringify(arr));
}
function isKeyUsed(key){
  const arr = getUsedKeys();
  return arr.includes(key);
}

function checkKey(){
  const k = document.getElementById('keyInput').value.trim();
  const msg = document.getElementById('keyMsg');
  msg.textContent = '';
  if(!k){ msg.textContent = 'Nhập key trước.'; return; }
  if(isKeyUsed(k)){
    msg.textContent = 'Key này đã bị sử dụng trước đó. Không thể dùng lại.';
    return;
  }
  if(!KEY_LIST[k]){
    msg.textContent = 'Key không hợp lệ.';
    return;
  }
  const mins = Number(KEY_LIST[k]) || 60;
  const expiresAt = Date.now() + mins * 60 * 1000;
  const access = { key: k, expiresAt };
  localStorage.setItem(LS_ACCESS, JSON.stringify(access));
  document.getElementById('keyBox').style.display = 'none';
  document.getElementById('mainTool').style.display = 'block';
  document.getElementById('keyMsg').textContent = 'Đã xác thực. Tool sẵn sàng.';
  startKeyTimer();
}

function restoreAccess(){
  try{
    const raw = localStorage.getItem(LS_ACCESS);
    if(!raw) return false;
    const acc = JSON.parse(raw);
    if(!acc || !acc.key || !acc.expiresAt) return false;
    if(isKeyUsed(acc.key)) { localStorage.removeItem(LS_ACCESS); return false; }
    if(Date.now() >= acc.expiresAt){
      markKeyUsed(acc.key);
      localStorage.removeItem(LS_ACCESS);
      return false;
    }
    document.getElementById('keyBox').style.display = 'none';
    document.getElementById('mainTool').style.display = 'block';
    document.getElementById('keyMsg').textContent = 'Đã đăng nhập (lưu trên thiết bị).';
    startKeyTimer();
    return true;
  } catch(e){ return false; }
}

let keyTimerInterval = null;
function startKeyTimer(){
  clearInterval(keyTimerInterval);
  keyTimerInterval = setInterval(()=>{
    const raw = localStorage.getItem(LS_ACCESS);
    const timerEl = document.getElementById('keyTimer');
    if(!raw){ timerEl.textContent = ''; clearInterval(keyTimerInterval); return; }
    const acc = JSON.parse(raw);
    const remain = acc.expiresAt - Date.now();
    if(remain <= 0){
      markKeyUsed(acc.key);
      localStorage.removeItem(LS_ACCESS);
      clearInterval(keyTimerInterval);
      document.getElementById('mainTool').style.display = 'none';
      document.getElementById('keyBox').style.display = 'block';
      document.getElementById('keyMsg').textContent = 'Key đã hết hạn.';
      timerEl.textContent = '';
      document.getElementById('result').innerHTML = '';
      return;
    }
    const mm = Math.floor(remain / 60000);
    const ss = Math.floor((remain % 60000) / 1000);
    timerEl.textContent = `time key : ${mm} phút ${ss} giây`;
  }, 1000);
}

// ========== NHẬN CẢ 32 VÀ 64 KÝ TỰ HEX ==========
function normalizeHashInput(s){
  let clean = s.trim().toLowerCase();
  if(/^[a-f0-9]{32}$/.test(clean)) return { type:'md5', value: clean };
  if(/^[a-f0-9]{64}$/.test(clean)) {
    // Băm SHA-256 xuống MD5 kiểu tạm: lấy 32 ký tự cuối + XOR 2 nửa
    let half1 = clean.slice(0,32);
    let half2 = clean.slice(32);
    let xored = '';
    for(let i=0;i<32;i++){
      let a = parseInt(half1[i],16);
      let b = parseInt(half2[i],16);
      xored += (a ^ b).toString(16);
    }
    return { type:'sha256', value: xored };
  }
  return null;
}

// ========== CÁC THUẬT TOÁN CŨ GIỮ NGUYÊN ==========
function hexPairToDec(pair){ return parseInt(pair,16); }
function algoHexSum(md5){
  const s = md5.slice(0,8);
  let sum = 0;
  for(let i=0;i<8;i+=2) sum += hexPairToDec(s.slice(i,i+2));
  const percent = sum % 100;
  const vote = (sum % 2 === 0) ? 'Tai' : 'Xiu';
  return { percent, vote };
}
function algoDelta(md5){
  let A=0,B=0;
  for(let i=0;i<md5.length;i++){
    const code = md5.charCodeAt(i);
    if(i%2===0) A += code; else B += code;
  }
  const delta = Math.abs(A-B);
  let percent;
  if(delta < 50) percent = 18 + Math.floor(delta*0.4);
  else if(delta < 120) percent = 40 + Math.floor((delta-50)*0.285);
  else percent = Math.min(95, 61 + Math.floor((delta-120)*0.08));
  percent = Math.max(0, Math.min(100, percent));
  const vote = percent >= 50 ? 'Tai' : 'Xiu';
  return { percent, vote };
}
function algoReverseBlocks(md5){
  const rev = md5.split('').reverse().join('');
  let sumBlocks = 0;
  for(let i=0;i<32;i+=4){
    const blk = rev.slice(i,i+4);
    sumBlocks += parseInt(blk,16) || 0;
  }
  const percent = sumBlocks % 100;
  const vote = percent >= 50 ? 'Tai' : 'Xiu';
  return { percent, vote };
}

// ========== NÂNG CẤP LOGIC MỚI ==========
function entropyScore(str){
  let freq = {};
  for(let ch of str) freq[ch] = (freq[ch]||0)+1;
  let entropy = 0;
  for(let k in freq){
    let p = freq[k]/str.length;
    entropy -= p * Math.log2(p);
  }
  return Math.min(100, Math.floor(entropy * 20));
}

function byteDistribution(md5){
  let sum=0;
  for(let i=0;i<md5.length;i+=2){
    sum += parseInt(md5.substr(i,2),16);
  }
  return sum % 100;
}

function advancedVote(md5){
  const entropy = entropyScore(md5);
  const byteVal = byteDistribution(md5);
  const parity = (parseInt(md5.slice(-2),16) % 2 === 0) ? 1 : -1;
  
  let rawPercent = (entropy + byteVal + (parity>0? 15 : 5)) % 100;
  rawPercent = Math.max(5, Math.min(95, rawPercent));
  
  const taiChance = rawPercent;
  const final = taiChance >= 50 ? 'Tai' : 'Xiu';
  return { percent: taiChance, final };
}

function aiVote(md5){
  const a1 = algoHexSum(md5);
  const a2 = algoDelta(md5);
  const a3 = algoReverseBlocks(md5);
  const a4 = advancedVote(md5);
  
  const weightedPercent = Math.round(
    (a1.percent * 0.2 +
     a2.percent * 0.25 +
     a3.percent * 0.2 +
     a4.percent * 0.35)
  );
  
  const taiVotes = [a1.vote,a2.vote,a3.vote,a4.final].filter(v=>v==='Tai').length;
  const final = taiVotes >= 2 ? 'Tai' : 'Xiu';
  return { final, percent: weightedPercent };
}

function runAnalyze(){
  const rawInput = document.getElementById('md5Input').value.trim();
  const resultEl = document.getElementById('result');
  resultEl.className = '';
  resultEl.textContent = '';
  
  const norm = normalizeHashInput(rawInput);
  if(!norm){
    resultEl.textContent = '❌ Chỉ chấp nhận MD5 (32) hoặc SHA-256 (64 ký tự hex)';
    return;
  }
  
  const hashValue = norm.value; // luôn là 32 ký tự hex sau khi chuẩn hóa
  const out = aiVote(hashValue);
  
  if(out.final === 'Tai'){
    resultEl.className = 'tai';
    resultEl.innerHTML = `🎯 <strong>TÀI</strong> (${out.percent}%)`;
  } else {
    resultEl.className = 'xiu';
    resultEl.innerHTML = `🔮 <strong>XỈU</strong> (${100 - out.percent}%)`;
  }
}

function clearAll(){
  document.getElementById('md5Input').value = '';
  document.getElementById('result').textContent = '';
}

window.addEventListener('load', ()=>{
  const restored = restoreAccess();
  if(!restored){
    document.getElementById('keyBox').style.display = 'block';
    document.getElementById('mainTool').style.display = 'none';
  }
});

function startMusic() {
  const music = document.getElementById('bgMusic');
  music.volume = 0.6;
  music.play().catch(()=>{});
  document.removeEventListener('click', startMusic);
}
document.addEventListener('click', startMusic);
</script>

</body>
</html>
